base_url = "https://otimeum.de"
title = "音也时馆"
description = "若是你所期待, 那定会得到强烈的回响."


theme = "tapestry"

compile_sass = true
build_search_index = true

taxonomies = [
    { name = "categories", feed = true },
    { name = "tags", feed = true },
]

generate_sitemap = true
generate_robots_txt = true
generate_feeds = true
feed_filenames = ["atom.xml", "rss.xml"]

[markdown]
github_alerts = true
insert_anchor_links = "heading"

[markdown.highlighting]
theme = "catppuccin-mocha"

[slugify]
paths = "safe"
taxonomies = "safe"
anchors = "safe"

[link_checker]
internal_level = "warn"

[extra]
presentation_style = "collective"
presentation_variant = "strata-geology"
presentation_style_switcher = false

header_title = "Otimeum"


main_menu = [
    { name = "最新帖子", url = "post", trailing_slash = true },
    { name = "关于我", url = "about", trailing_slash = true },
    { name = "标签", url = "tags", trailing_slash = true },
    { name = "归档", url = "archive", trailing_slash = true },
    { name = "Github", url = "https://github.com/LnyOtoya", new_tab = true },
]

socials = [
    { name = "github", url = "https://github.com/LnyOtoya" },
]

[extra.content_security_policy]
enable = false
allowed_domains = ["https://steady-empanada-d26bc2.netlify.app"]
